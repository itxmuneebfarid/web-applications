<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border and Box Shadow</title>

    <style>
        /* Main Box */
        .box {
            width: 300px;
            height: 150px;

            /* Box Model */
            padding: 20px;
            margin: 50px auto;

            /* Border */
            border: 5px solid black;
            border-radius: 15px;

            /* Box Shadow */
            box-shadow: 10px 10px 20px gray;

            background-color: lightblue;

            text-align: center;
        }

        h2 {
            color: darkblue;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>CSS Box Model</h2>
        <p>Border and Box Shadow</p>
    </div>

</body>
</html>
