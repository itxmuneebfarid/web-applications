<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Contact Now</title><link rel="stylesheet" href="style.css"></head><body><div class="topbar">Grey background area</div><main class="contact-card"><aside><p class="eyebrow">GET IN TOUCH</p><h1>Contact Now</h1><p>Have a question? Send us a message and we will get back to you.</p><div class="contact-info"><p>☎ &nbsp; +92 40 4305001</p><p>✉ &nbsp; info@example.com</p><p>⌖ &nbsp; Sahiwal, Pakistan</p></div></aside><section><div class="social"><a href="https://www.facebook.com/" aria-label="Facebook">f</a><a href="https://twitter.com/" aria-label="Twitter">t</a><a href="https://www.instagram.com/" aria-label="Instagram">◎</a><a href="https://www.google.com/" aria-label="Google">G+</a></div><form><label>Name<input required placeholder="Your name"></label><label>Email<input type="email" required placeholder="Your email"></label><label>Department<select required><option value="">Select a Department</option><option>Computer Science</option><option>Admissions</option><option>Student Affairs</option><option>Other</option></select></label><label>Message<textarea rows="4" required placeholder="Write your message..."></textarea></label><button type="submit">Send Message</button></form></section></main><footer>Grey background area</footer><script>document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();alert('Thank you. This demonstration form is not connected to a mail server.');});</script></body></html>
