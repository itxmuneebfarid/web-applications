<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        /* Internal CSS */

        body {
            background-color: #f2f2f200;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 400px;

            /* Box Model */
            margin: 50px auto;
            padding: 30px;
            border: 5px solid rgb(94, 255, 0);

            background-color: white;
            text-align: center;
        }

        h1 {
            color: rgb(0, 238, 255);
        }

        p {
            margin: 20px;
            padding: 15px;
            border: 2px solid gray;
        }

        button {
            margin: 15px;
            padding: 12px 25px;
            background-color: rgb(0, 238, 255);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(139, 116, 0);
        }
    </style>
</head>

<body>

    <div class="container">

       <italic> <b><h1>Introduction</h1></b></italic>

        <p>
            My name is Muneeb Farid .
            I am Artificial intelligence Developer .
        </p>

        <button>Contact me </button>

    </div>

</body>
</html>
